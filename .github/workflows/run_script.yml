name: Run Script Workflow

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run_my_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ~/devops-practice/scripting/greet.sh

      - name: Run the script
        run: ./scripting/greet.sh
