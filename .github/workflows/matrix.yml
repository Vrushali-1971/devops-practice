name: Matrix Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-multiple-versions:
    strategy:
      matrix: 
        os: [ubuntu-latest, ubuntu-22.04]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
   
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Show Python version 
        run: python --version

      - name: Show OS
        run: uname -a
  
