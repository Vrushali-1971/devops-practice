name: Log Analyzer CI

on: 
  push:
    branches:
      - master

jobs:
  log-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Docker container and collect logs
        run: |
          mkdir -p logs
          
          docker run -d --name test-container nginx
          sleep 5
          docker logs test-container > logs/app.log 2>&1

      - name: Cleanup container
        run: docker rm -f test-container

      - name: Make script executable
        run: chmod +x scripting/log_analyzer.sh

      - name: Run log analyzer
        run: | 
          set +e
          ./scripting/log_analyzer.sh logs > result.txt
          exit_stat=$?
          echo "Exit status: $exit_stat" >> result.txt
          set -e
          exit $exit_stat

       
      - name: Show total errors
        if: always()
        run: echo "Total errors from script: $TOTAL_ERRORS"

     
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: Result
          path: |
            logs/
            result.txt
      
            
